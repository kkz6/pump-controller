<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1530" viewBox="0 0 1800 1530"><title>Rev E pump controller and DOL starter connections</title><desc>Connection overview: existing DOL starter with unchanged motor and capacitor wiring, four-mount100x80mm main board, separate60x45mm low-voltage panel, direct one-to-one GH12 cable and PH4 OLED. Functional coil chain preserves existing STOP and overload. Drawing is not a terminal identification from a photograph.</desc><defs><pattern id="barrier" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#fff3d7"/><rect width="3" height="10" fill="#e4c383"/></pattern></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#153548;font-size:21px}.title{font-size:32px;font-weight:700}.head{font-size:26px;font-weight:700}.label{font-size:20px;font-weight:700}.small{font-size:18px;fill:#506975}.tiny{font-size:16px;fill:#506975}.mono{font-family:Menlo,Consolas,monospace;font-size:18px}</style><rect width="1800" height="1530" fill="#f3f6f7"/>
