<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
<title>Guarded R3 USB service cartridge, front elevation, axial section and isolation sequence</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334e68"/></marker><pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-1,1 l2,-2 M0,8 l8,-8 M7,9 l2,-2" stroke="#94a3b8" stroke-width="1"/></pattern><style>
text{font-family:Arial,sans-serif;fill:#152943}.title{font-size:32px;font-weight:bold}.section{font-size:21px;font-weight:bold}.normal{font-size:17px}.small{font-size:15px}.dim{fill:none;stroke:#334e68;stroke-width:1.4;marker-start:url(#a);marker-end:url(#a)}.leader{fill:none;stroke:#425770;stroke-width:1.4;marker-end:url(#a)}.fixed{fill:#e1e7eb;stroke:#567180;stroke-width:2}.moving{fill:#fbd67d;stroke:#98691c;stroke-width:2}.safety{fill:#d3e7dd;stroke:#377b55;stroke-width:2}.dashed{fill:none;stroke:#a36a00;stroke-width:2;stroke-dasharray:6 5}.line{fill:none;stroke:#425770;stroke-width:1.5}.fine{fill:none;stroke:#8194a7;stroke-width:1;stroke-dasharray:4 3}</style></defs>
<rect width="1400" height="980" fill="white"/>
<text x="38" y="53" class="title">R3 USB service cartridge</text><text x="38" y="82" class="normal">Concept assembly in case coordinates, dimensions in mm. Use the STEP geometry and separate 1:1 DXF files for part geometry.</text><path d="M38 99H1360" class="line"/>
<text x="38" y="136" class="section">Front elevation from outside the cabinet</text><text x="38" y="162" class="small">Outer tool-fastened shrouds omitted here to expose the mechanism. +X points right and +Z points up.</text>
<rect x="83" y="218" width="410" height="96" rx="2" class="fixed"/><rect x="84" y="228" width="330" height="75" fill="#a7b3be"/><rect x="409" y="228" width="86" height="75" fill="#c77372"/>
<text x="95" y="243" class="normal">SG1 D4NS-4BF</text>
<rect x="62" y="272" width="478" height="42" class="moving"/><circle cx="280" cy="293" r="13" fill="white" stroke="#85580c" stroke-width="2"/>
<circle cx="280" cy="293" r="8" class="safety"/><text x="90" y="301" class="small">AL1 captive-bolt strike</text>
<rect x="542" y="244" width="47" height="49" class="moving"/><circle cx="563" cy="253" r="4" fill="#424c59"/><circle cx="563" cy="281" r="4" fill="#424c59"/><path d="M542 270H482" stroke="#71818d" stroke-width="7"/>
<path d="M531 254V369H515" stroke="#98691c" stroke-width="7" fill="none"/>
<rect x="333" y="338" width="188" height="50" class="moving"/><rect x="406" y="351" width="66" height="26" fill="none" stroke="#203f57" stroke-width="2"/>
<rect x="499" y="338" width="188" height="50" class="dashed"/>
<path d="M330 407H501" class="dim"/><text x="358" y="428" class="normal">40.0 stroke</text>
<text x="75" y="346" class="small">Single bolt window at RUN.</text><text x="75" y="368" class="small">The strike moves with the blade.</text>
<text x="38" y="460" class="normal">At RUN, the blade covers the full bore. Pull right to withdraw the SG1 tongue.</text>
<text x="38" y="487" class="normal">Steel stops carry the load at both endpoints. The dashed outline shows the open blade.</text>
<path d="M778 116V501" class="fine"/>
<text x="804" y="136" class="section">Section along the plug axis</text><text x="804" y="163" class="small">Detail near the PCB edge, schematic scale. +Y points into the case.</text>
<rect x="825" y="229" width="269" height="17" class="fixed"/><rect x="825" y="326" width="269" height="17" class="fixed"/>
<rect x="1099" y="210" width="15" height="150" class="moving"/><rect x="1141" y="244" width="158" height="10" class="fixed"/><rect x="1141" y="314" width="158" height="10" class="fixed"/>
<rect x="1141" y="327" width="161" height="14" class="safety"/><path d="M1141 210V360" class="fine"/>
<path d="M847 286H1080" class="leader"/><text x="852" y="275" class="normal">Plug insertion</text><text x="1170" y="279" class="normal">J40</text><text x="1163" y="303" class="small">USB4110</text>
<path d="M1106 190V209 M1141 188V207 M1106 195H1141" class="dim"/>
<text x="875" y="199" class="small">0.95 to blade centre</text>
<text x="805" y="388" class="normal">Axis at X92, Y25, Z27.28. Gate is 0.60 ±0.03 thick.</text>
<text x="805" y="414" class="normal">Gauge against the actual soldered receptacle.</text>
<text x="805" y="440" class="normal">Minimum clearance to J40 at worst case is 0.275.</text>
<text x="805" y="466" class="normal">The blade stays within the 1.85 exposed shell region</text><text x="805" y="490" class="normal">with 0.225 minimum allowance.</text>
<path d="M38 520H1360" class="line"/>
<text x="38" y="555" class="section">Gate travel from hard RUN stop</text><path d="M100 631H1290" stroke="#7f949f" stroke-width="4"/>
<g font-size="15"><path d="M100 619V644 M121 619V645 M490 619V645 M615 619V645 M835 619V645 M1290 619V645" stroke="#284354" stroke-width="2"/>
<text x="72" y="610">0</text><text x="111" y="674">≤0.7</text><text x="435" y="609">13.1 max.</text><text x="565" y="674">17.3 min.</text><text x="780" y="610">24.7 min.</text><text x="1265" y="674">40</text></g>
<text x="38" y="711" class="normal">AL1 can release the feeder key only at the closed stop. SG1 positive opening is complete by 13.1. First aperture visibility is at 17.3 or later.</text>
<text x="38" y="739" class="normal">A retained plug obstructs return before the gate reaches 24.7. The motor feeder stays isolated throughout service via QISO1 and AL1.</text>
<path d="M38 765H1360" class="line"/>
<text x="38" y="804" class="section">Installed service sequence</text>
<text x="38" y="844" class="normal">1. Open QISO1 upstream of both motor contactors. Only the OFF position releases its unique service key.</text>
<text x="38" y="876" class="normal">2. Insert the key in AL1 and retract its bolt. AL1 retains the key. Slide the gate fully open before plugging in USB.</text>
<text x="38" y="908" class="normal">3. Remove the plug, close the gate against its stop, extend AL1 through the strike into the fixed keeper and recover the key.</text>
<text x="38" y="940" class="normal">4. Return the key to QISO1. Apply the separate starter rearm procedure. Physical first-article and installed tests are outstanding.</text>
</svg>
